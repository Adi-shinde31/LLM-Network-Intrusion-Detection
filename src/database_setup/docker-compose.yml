version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: network_db
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - network_pipeline

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_ui
    restart: always
    env_file:
      - .env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - network_pipeline

  python-app:
    build: .
    container_name: data_loader
    command: jupyter nbconvert --to script --execute --inplace /app/load_to_postgre.ipynb
    env_file:
      - .env
    volumes:
      - ${PYTHON_SCRIPT_PATH}:/app/load_to_postgre.ipynb
      - ${CSV_DATA_PATH}:/data
    depends_on:
      - postgres
    networks:
      - network_pipeline

volumes:
  pgdata:

networks:
  network_pipeline:
